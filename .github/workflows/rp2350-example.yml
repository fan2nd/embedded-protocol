name: RP2350 hardware example
on:
  workflow_dispatch:
  push:
    paths: ['examples/rp2350/**', 'crates/monitor-protocol/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', '.github/workflows/rp2350-example.yml']
  pull_request:
    paths: ['examples/rp2350/**', 'crates/monitor-protocol/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', '.github/workflows/rp2350-example.yml']
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          rustup target add thumbv8m.main-none-eabihf
      - name: Check example
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p rp2350-dashboard --all-targets -- -D warnings
          cargo clippy --locked -p rp2350-monitor --target thumbv8m.main-none-eabihf --release -- -D warnings
          cargo run --locked -p rp2350-dashboard --example preview -- output/examples/rp2350
      - name: Build UF2
        run: sh examples/rp2350/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: rp2350-example
          path: |
            output/examples/rp2350/*.uf2
            output/examples/rp2350/*.elf
            output/examples/rp2350/*.ppm
          if-no-files-found: error
