[package]
name = "pc-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
dashboard = { path = "../dashboard" }
embassy-rp = { version = "=0.9.0", features = ["rp235xa", "time-driver", "critical-section-impl"] }
embassy-executor = { version = "=0.9.1", features = ["arch-cortex-m", "executor-thread"] }
embassy-time = "=0.5.1"
embassy-sync = "=0.7.2"
embassy-usb = "=0.5.1"
embassy-futures = "=0.1.2"
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
panic-halt = "1.0.0"
static_cell = "2.1.1"

[profile.release]
debug = 2
opt-level = "s"
lto = true
codegen-units = 1
